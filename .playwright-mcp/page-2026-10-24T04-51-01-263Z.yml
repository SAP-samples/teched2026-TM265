                            - text: 10:19 PM
                          - generic [ref=f45e921]: "Everyone,IT requested that I share this problem and solution with everyone, as they are currently overwhelmed with tickets for this issue. Cross-share as needed. Symptom: Mac users - Your working MS Authenticator passkey does not work with Salesforce. Scanning the QR code causes it to spin in the app until it times out. Solution: The sequence matters here, so, first attempt to log in with your passkey using Safari as the browser. The browser is the most important part of this instruction. If this is successful, then clear your cache and browser history in your preferred browser. Then attempt to log in on the preferred browser. Following this sequence should work, if not, you'll need to delete your existing passkey and set up a new one (details in thread) and then do the above steps with the new one."
