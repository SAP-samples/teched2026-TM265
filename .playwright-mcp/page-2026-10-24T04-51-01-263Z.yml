                          - button "Barb Lewis-Homeier" [ref=f45e845] [cursor=pointer]
                          - link "Sep 26th at 4:33:05 AM" [ref=f45e846] [cursor=pointer]:
                            - /url: https://concur-blue.slack.com/archives/C03EE7DDF/p1790368385481519
                            - text: 4:33 AM
                          - generic [ref=f45e852]:
                            - link "#ask-profile" [ref=f45e853] [cursor=pointer]:
                              - /url: https://sap.enterprise.slack.com/archives/C0ARTP7E56V
                            - text: "McGraw Hill LLC Environment: us2, Entity Code: p00695285lac, Company ID 74557McGraw Hill LLC is an indirect travel only customer with GBT. They are a former expense customer. GBT placed an order for an indirect travel only HR Feed for them - that project was assigned to me. When we do this, we have to re enable the original entity ID. One of the requirements of an indirect travel only hr feed is that the Client SFA ID in CMC needs to say INDIRECT rather than the SFA ID alpha numerics in Salesforce. The feed is running successfully - and at initial implementation the users appeared via the application server login - and TOOLS was an available item in Company Admin. Once I made the change to INDIRECT, the users - while they still appear in user admin via travel logins - they do not appear in user admin if I use the application server login via CMC. TOOLS is also not available to the admin - or any user who had it previously assigned; I cannot access the users so I cannot verify / reassign any permissions. This means no one can view the error logs. This is not a new practice - we always use INDIRECT for new setups - and we change existing to INDIRECT as well. But for some reason this time, it has created an issue.Often this means a job chain issue - but it is active - or an extract to travel issue - but that is also scheduled.I requested assistance from my Technical Consultant counterparts and they verified the permissions - they also checked the below - and then advised I should check in with lifecycle management - so here I am. Please let me know what else I can share that will help you help me - thank you in advance. (lifecycle management suggested core-profile, core-profile suggested ask-profile)For your site, the CT_EMPLOYEE_ROLE_MAP table shows that the roles are still assigned to both regular users as well as Concur Admin. What's interesting is that beside the Expense User permission still being granted to the Concur Admin and Expense Module still being enabled in CTE, the Expense based admin UI is not available to the Concur Admin either.We can get to the Tools menu in the site using direct URL:"
                            - link "Tools" [ref=f45e861] [cursor=pointer]:
                              - /url: https://us2.concursolutions.com/expense/admin/expenseTools.asp
                            - text: but it won't show the Import Extract Monitor. Trying to the Import/Extract UI using the direct URL (
                            - link "Sign in to Concur | Concur Solutions" [ref=f45e864] [cursor=pointer]:
                              - /url: https://us2.concursolutions.com/expense/admin/jobManagement.asp
                            - text: ) will be denied is flagged as security breach:Performing a CUP XML import only enters the already existing permissions, so that does not fix it either (tried it), the underlying issue is the unavailability of the Expense portion of the site.
